name: swe-patch-team

on:
  push:
    branches: ["main"]
    paths:
      - "swe-patch-team/**"
      - ".github/workflows/swe-patch-team.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "swe-patch-team/**"
      - ".github/workflows/swe-patch-team.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swe-patch-team

    steps:
      - uses: actions/checkout@v4

      # google-adk 2.x requires Python 3.11+.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            swe-patch-team/requirements.txt
            swe-patch-team/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # The tests script the model, so no ANTHROPIC_API_KEY is needed.
      - name: Test with pytest
        run: pytest
